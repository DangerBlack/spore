# Serving the gate. Almost nothing to configure — it is static files — but the
# two rules below matter more than they look.

server {
    # default_server, not left to file order: nginx otherwise makes whichever
    # server block it reads first the default, and a content-isolation.conf
    # sorting ahead of this file would quietly take over the gate's host.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The gate is a single page; every path resolves to it. The site being
    # viewed lives in the URL fragment, which never reaches this server at all.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A cached service worker outliving its own fix is the single most
    # expensive bug this project has hit: everything reports healthy and
    # nothing works. Never let one be cached.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # The gate's own code, small and changing together. Revalidate rather than
    # serve a page that disagrees with the worker it registered.
    location ~ ^/(index\.html|app\.css|js/) {
        add_header Cache-Control "no-cache";
    }

    # The vendored WebTorrent bundle is versioned by its contents and large
    # enough to be worth caching properly.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;
    gzip_min_length 1024;
}

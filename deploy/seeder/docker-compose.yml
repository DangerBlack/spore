# Seed one site, permanently, including every version of it — this does NOT
# host the gate.
#
# If you are looking for "run Spore so people can browse", that is
# deploy/gate/. This keeps a single published site reachable when nobody has a
# tab open.
#
#   cd deploy/seeder
#   cp .env.example .env && $EDITOR .env     # name, site, passphrase
#   mkdir -p site data && cp -r /path/to/your-website/. site/
#   docker compose up -d
#   curl -s localhost:8081                   # is it actually serving?
#
# Edit anything in site/ and a new version is published within
# SPORE_WATCH_SECONDS, signed, and offered to readers still on the old one. The
# old versions keep being seeded — that is not politeness, it is the mechanism:
# only a peer holding the version someone is reading can tell them there is a
# newer one.

services:
  seeder:
    # Built from the repository root: the seeder shares the gate's own signing
    # code, so it needs js/ as well as tools/.
    build:
      context: ../..
      dockerfile: deploy/seeder/Dockerfile
    restart: unless-stopped
    # node as PID 1 ignores the SIGTERM of `docker stop`, which then waits 10 s
    # and kills it; a tiny init passes the signal on, so it stops at once.
    init: true

    # Everything is configured here, so there are no arguments to get wrong and
    # the passphrase never appears in a command line — where `docker inspect`,
    # `ps` and shell history would all have it.
    env_file: .env

    # The image runs as uid 1000 so that files in data/ belong to you rather than
    # to root. If your account is not uid 1000, uncomment this — otherwise the
    # seeder cannot write its version history and will say so and stop.
    # user: "${UID}:${GID}"

    volumes:
      # Bind mounts, not named volumes: you edit site/ yourself, and data/ is
      # the version history — worth being able to see and back up.
      #
      # Create both before the first `up`. Docker creates a missing bind-mount
      # source itself, as root, and then the seeder has to take ownership of a
      # directory it did not make. It does, but starting from a directory that
      # is already yours is tidier.
      #
      # The folder you edit. Read-only is fine and correct: the seeder copies
      # each version into data/ and seeds the copy, so it never writes here.
      - ./site:/site:ro
      # Every published version, frozen, plus versions.json. KEEP THIS. It is
      # what makes each magnet permanent and what lets old readers be told
      # about new versions.
      - ./data:/data

    # Nothing to publish inbound for the swarm itself: WebRTC connections are
    # established outbound through the trackers, so seeding needs no
    # forwarding. That much was always true, and it was not enough.
    #
    # `network_mode: bridge` — what this file used to say — puts the container
    # behind Docker's masquerade, which allocates a fresh external port per
    # destination. That is a symmetric NAT, and it is fatal to WebRTC: the
    # address a peer learns from a STUN server is true only towards that STUN
    # server, so every introduction a tracker makes ends in a connection that
    # never opens. Measured on a public VPS running this file: trackers
    # replying within seconds, three versions complete and verified, and after
    # eighteen minutes zero peers and zero bytes served, while readers were
    # told the site could not be found.
    #
    # Host networking removes that layer. It still forwards nothing and opens
    # nothing inbound for the swarm; it just lets the container use the
    # machine's own address, which is what ICE needs to be able to advertise.
    # The seeder now tests this at startup and says so if it is wrong.
    #
    # `ports:` is gone because host networking ignores it — there is no NAT to
    # forward through. Nothing is lost: the status endpoint binds loopback
    # itself now (SPORE_STATUS_HOST, 127.0.0.1 by default), so `curl
    # localhost:8081` on the box works exactly as the old mapping made it work. It answers
    # `curl` on the box and the healthcheck, and nothing off the machine. It
    # used to bind every interface and be saved by the mapping, which meant the
    # line above quietly decided whether a service was public. Set
    # SPORE_STATUS_HOST=0.0.0.0 if you actually want it reachable.
    network_mode: host
